[config]

[templates.colorsjson]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.config/catastrophic/colors/colors.json'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors-matugen.conf'
post_hook = 'pkill -SIGUSR1 kitty || true'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.hyprland-lua]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload'

[templates.hyprtoolkit]
input_path = '~/.config/matugen/templates/hyprtoolkit-colors.conf'
output_path = '~/.config/hypr/hyprtoolkit.conf'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = '~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'

[templates.swaync]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/swaync/colors.css'

[templates.walker]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/walker/colors.css'

[templates.sequences]
input_path = '~/.config/matugen/templates/sequences'
output_path = '~/.cache/wal/sequences'

[templates.primary]
input_path = '~/.config/matugen/templates/primary'
output_path = '~/.config/catastrophic/colors/primary'

[templates.secondary]
input_path = '~/.config/matugen/templates/secondary'
output_path = '~/.config/catastrophic/colors/secondary'

[templates.on_surface]
input_path = '~/.config/matugen/templates/onsurface'
output_path = '~/.config/catastrophic/colors/onsurface'

[templates.on_primary]
input_path = '~/.config/matugen/templates/onprimary'
output_path = '~/.config/catastrophic/colors/onprimary'

[templates.catastrophic_dotfiles_settings]
input_path  = "./templates/colors.json"
output_path = "~/.local/share/catastrophic-dotfiles-settings/colors/colors.json"

# Colors of the Catastrophic Dock (github.com/catastrophic-os/catastrophic-dock), which reads
# its own copy so it can also run without the rest of the Catastrophic shell. It watches the file, so no
# post_hook is needed. The path is theme.colorsFile in ~/.config/catastrophic-dock/config.json.
[templates.catastrophic_dock]
input_path  = "./templates/colors.json"
output_path = "~/.config/catastrophic-dock/colors.json"

# Colors of the Catastrophic Power Menu (github.com/catastrophic-os/catastrophic-powermenu), which
# reads its own copy like the dock. The path is theme.colorsFile in
# ~/.config/catastrophic-powermenu/config.json.
[templates.catastrophic_powermenu]
input_path  = "./templates/colors.json"
output_path = "~/.config/catastrophic-powermenu/colors.json"

[templates.quickshell_overview]
input_path  = "./templates/quickshell-overview.qml"
output_path = "~/.local/share/quickshell-overview/common/Appearance.colors.qml"

[templates.ohmyposh]
input_path = '~/.config/matugen/templates/ohmyposh-colors.json'
output_path = '~/.config/ohmyposh/colors.json'
post_hook = "jq --slurpfile palette ~/.config/ohmyposh/colors.json '. + $palette[0]' ~/.config/ohmyposh/EDM115-newline.omp.json > /tmp/new_theme.json && mv /tmp/new_theme.json ~/.config/ohmyposh/EDM115-newline.omp.json"


# Qt apps (qt6ct palette) and KDE apps (kdeglobals colors)
[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt6ct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.kde]
input_path = '~/.config/matugen/templates/kde-colors.ini'
output_path = '~/.cache/matugen/kde-colors.ini'
post_hook = 'python3 -I ~/.config/matugen/post-hook-scripts/kde-colors.py'
