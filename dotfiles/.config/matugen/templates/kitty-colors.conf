# Generated by matugen from ~/.config/matugen/templates/kitty-colors.conf

cursor                {{colors.on_surface.default.hex}}
cursor_text_color     {{colors.surface.default.hex}}

foreground            {{colors.on_surface.default.hex}}
background            {{colors.surface.default.hex}}
selection_foreground  {{colors.on_secondary_container.default.hex}}
selection_background  {{colors.secondary_container.default.hex}}
url_color             {{colors.primary.default.hex}}

active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.outline_variant.default.hex}}
active_tab_foreground   {{colors.on_secondary_container.default.hex}}
active_tab_background   {{colors.secondary_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
tab_bar_background      {{colors.surface.default.hex}}

# Black is the background itself, so programs that paint "black" (cmatrix,
# htop, ...) blend in instead of drawing grey blocks
color0   {{colors.surface.default.hex}}
color8   {{colors.outline.default.hex}}

# Soft ANSI hues tuned to sit on slate
color1   #e8838f
color9   #f2a3ac
color2   #8fcf9f
color10  #addfb9
color3   #e2c58c
color11  #eed6a8
color4   {{colors.primary.default.hex}}
color12  {{colors.primary_fixed.default.hex}}
color5   #c3a6e8
color13  #d5c1f1
color6   #85c9d4
color14  #a7dbe3
color7   {{colors.on_surface_variant.default.hex}}
color15  {{colors.on_surface.default.hex}}

# Cells painted in the background color keep the window's transparency
# (keep in sync with background_opacity in kitty.conf)
transparent_background_colors {{colors.surface.default.hex}}@0.9
