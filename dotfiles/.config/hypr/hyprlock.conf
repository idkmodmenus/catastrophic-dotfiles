# Lock screen in the shell's look: a rounded card on the blurred wallpaper
# with the dashboard's clock, date, media line and a pill-shaped password field.

# Cache Folder
$catastrophic_cache_folder = $HOME/.cache/catastrophic/hyprland-dotfiles

# Source colors
source = colors.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, out
    animation = fadeOut, 1, 3, out
    animation = inputFieldDots, 1, 2, out
}

background {
    monitor =
    path = $catastrophic_cache_folder/blurred_wallpaper.png   # only png supported for now
    blur_passes = 0
}

# Card behind everything else
shape {
    monitor =
    size = 440, 520
    color = $surface_container
    rounding = 36
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

image {
    monitor =
    path = $catastrophic_cache_folder/square_wallpaper.png
    size = 110 # lesser side if not 1:1 ratio
    rounding = -1 # negative values mean circle
    border_size = 3
    border_color = $primary
    position = 0, 190
    halign = center
    valign = center
    zindex = 1
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
    zindex = 1
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $on_surface_variant
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 22
    halign = center
    valign = center
    zindex = 1
}

# What is playing, if anything
label {
    monitor =
    text = cmd[update:3000] $HOME/.config/hypr/scripts/lock-media.sh
    color = $primary
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -28
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = $primary
    inner_color = $surface_container_high
    font_color = $on_surface
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>󰌾  Password</i>
    hide_input = false
    rounding = -1
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $tertiary
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -105
    halign = center
    valign = center
    zindex = 2
}

# User and battery along the bottom of the card
label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -195
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:30000] b=/sys/class/power_supply/BAT*/capacity; [ -r $(ls $b 2>/dev/null | head -1) ] && echo "󰁹  $(cat $(ls $b | head -1))%"
    color = $on_surface_variant
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -225
    halign = center
    valign = center
    zindex = 1
}
